# SIERAP local development infrastructure.
# Usage: docker compose up -d   (then start backend and frontend separately, see README)
services:
  postgres:
    image: postgres:17-alpine
    container_name: sierap-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sierap}
      POSTGRES_USER: ${DB_USERNAME:-sierap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sierap}
      TZ: America/Bogota
    ports:
      # If you already have a local PostgreSQL on 5432, use e.g. DB_PORT=5433
      # and point the backend with DB_URL=jdbc:postgresql://localhost:5433/sierap
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sierap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sierap-postgres-data:

# Infraestructura de desarrollo local de SIERAP.
# Uso: docker compose up -d   (PostgreSQL + Mailpit; backend y frontend se levantan aparte, ver README)
# Todo el sistema en contenedores (ADR-019): docker compose --profile app up -d --build
#   -> app en http://localhost:5173, bandeja de correos en http://localhost:8025
services:
  postgres:
    image: postgres:17-alpine
    container_name: sierap-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sierap}
      POSTGRES_USER: ${DB_USERNAME:-sierap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sierap}
      TZ: America/Bogota
    ports:
      # Si ya tienes un PostgreSQL local en el 5432, usa p. ej. DB_PORT=5433
      # y apunta el backend con DB_URL=jdbc:postgresql://localhost:5433/sierap
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sierap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Servidor SMTP de pruebas: captura los correos (enlaces de contraseña) sin
  # enviarlos. Bandeja web en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: sierap-mailpit
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # --- Perfil "app": el sistema completo en contenedores (ADR-019) ---
  # Solo se levantan con --profile app; así "docker compose up -d" sigue levantando
  # únicamente la base de datos y Mailpit para quien corre el backend con ./mvnw.
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: sierap-backend
    environment:
      # Perfil dev: clave JWT de desarrollo y cookie de sesión sin https (local).
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sierap}
      DB_USERNAME: ${DB_USERNAME:-sierap}
      DB_PASSWORD: ${DB_PASSWORD:-sierap}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SIERAP_STORAGE_PATH: /var/sierap-files
      SIERAP_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      TZ: America/Bogota
    volumes:
      - sierap-files:/var/sierap-files
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: sierap-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sierap-postgres-data:
  sierap-files:

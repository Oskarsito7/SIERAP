# CI de SIERAP: valida backend y frontend en cada Pull Request hacia develop/main
# y en cada push a esas ramas. Los dos jobs son los "status checks" que deben
# exigirse en la protección de ramas (docs/06-plan-de-trabajo.md, sección 3.7).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila, corre las pruebas unitarias y las de integración (Testcontainers
      # levanta PostgreSQL en el Docker del runner) y empaqueta el jar.
      - name: Compilar y probar
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build (incluye verificación de tipos)
        run: npm run build

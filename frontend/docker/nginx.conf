# nginx del contenedor del frontend (ADR-019).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Entregas (ADR-015): .zip hasta 100 MB + presentación hasta 30 MB.
    client_max_body_size 135m;

    # La API va al contenedor del backend, igual que el proxy de Vite en desarrollo.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Perfil de desarrollo local. Los valores por defecto coinciden con docker-compose.yml.
# Para sobreescribirlos sin tocar este archivo: variables de entorno, o un
# application-local.yml (ignorado por git) activando --spring.profiles.active=dev,local
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sierap}
    username: ${DB_USERNAME:sierap}
    password: ${DB_PASSWORD:sierap}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    co.edu.unicesar.sierap: DEBUG

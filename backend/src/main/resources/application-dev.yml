# Local development profile. The defaults match docker-compose.yml.
# To override them without touching this file: environment variables, or an
# application-local.yml (ignored by git) activated with --spring.profiles.active=dev,local
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sierap}
    username: ${DB_USERNAME:sierap}
    password: ${DB_PASSWORD:sierap}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    co.edu.unicesar.sierap: DEBUG

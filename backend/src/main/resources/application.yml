# Configuración común a todos los perfiles.
# Perfil por defecto: dev. En producción: --spring.profiles.active=prod
spring:
  application:
    name: sierap
  profiles:
    default: dev
  jpa:
    # El esquema lo crean y versionan las migraciones de Flyway; Hibernate solo
    # valida que las entidades coincidan con las tablas.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  # Correo para los enlaces de crear o recuperar la contraseña (ADR-017).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

sierap:
  version: '@project.version@'
  # Las reglas de fechas (entregas, ventana de evaluación) se evalúan en esta zona.
  time-zone: America/Bogota

  # Autenticación y sesiones (ADR-017). La clave del JWT llega siempre por entorno.
  auth:
    jwt-secret: ${SIERAP_JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 7
    refresh-cookie-secure: true
    setup-link-hours: 72
    reset-link-hours: 1
    frontend-url: ${SIERAP_FRONTEND_URL:http://localhost:5173}
    institutional-email-domain: unicesar.edu.co
    mail-from: ${MAIL_FROM:SIERAP <no-reply@unicesar.edu.co>}

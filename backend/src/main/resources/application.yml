# Configuration shared by every profile.
# Default profile: dev. In production: --spring.profiles.active=prod
spring:
  application:
    name: sierap
  profiles:
    default: dev
  jpa:
    # The schema is created and versioned by the Flyway migrations; Hibernate only
    # validates that the entities match the tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

sierap:
  version: '@project.version@'
  # Date rules (submissions, grading window) are evaluated in this time zone.
  time-zone: America/Bogota

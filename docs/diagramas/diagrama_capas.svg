<text x="1300" y="1190" font-weight="bold" fill="#1F2937">Reglas de la arquitectura</text>
<text x="1300" y="1205" fill="#1F2937">• Cada capa solo usa la inmediatamente inferior.</text>
<text x="1300" y="1220" fill="#1F2937">• Las entidades JPA nunca salen de la API: el</text>
<text x="1300" y="1235" fill="#1F2937">   controller siempre responde con DTOs.</text>
<text x="1300" y="1250" fill="#1F2937">• Sin lógica de negocio en los controllers.</text>
<text x="1300" y="1265" fill="#1F2937">• Sin try/catch disperso: errores en exception.</text>
<text x="1300" y="1280" fill="#1F2937">• Nada de valores de negocio hardcodeados.</text>
<text x="40" y="42" text-anchor="start" font-size="22" font-weight="bold" fill="#1F2937">SIERAP — Arquitectura por capas (diagrama de paquetes)</text>
<text x="40" y="66" text-anchor="start" font-size="13" fill="#64748B">Cliente web React + API REST en Spring Boot organizada en presentación, lógica de negocio, datos y entidades, con componentes transversales.</text>
